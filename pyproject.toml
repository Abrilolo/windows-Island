[project]
name = "nook-bridge"
version = "0.1.0"
description = "Local zero-cost bridge between Nook notch (Windows) and Minimal Launcher (Android) powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts", "src/brain", "src/sync", "src/mail", "src/nook_plugin"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"

